<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — Sri Badrika Ashram</title>
<meta name="description" content="Sign in to your Sri Badrika Ashram account.">
<script>
  // Follow the computer's light / dark setting (a toggle press overrides it for this visit only),
  // applied before first paint to avoid a flash
  (function () {
    var t = null;
    try { localStorage.removeItem('sba-theme'); t = sessionStorage.getItem('sba-theme'); } catch (e) {}
    if (t !== 'light' && t !== 'dark') {
      t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>
<link rel="preload" href="fonts/Forum-Regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/Outfit-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/site.css?v=20261114q">
</head>
<body data-page="signin">

<!-- ============ Navigation ============ -->
<header class="nav">
  <div class="nav-brand">
    <a href="./" aria-label="Sri Badrika Ashram — home">
      <img class="d-only" src="assets/logo.svg" width="222" height="28" alt="Sri Badrika Ashram">
      <img class="m-only" src="assets/m-logo.svg" width="254" height="32" alt="Sri Badrika Ashram">
    </a>
  </div>
  <div class="nav-actions">
   <div class="nav-tabs">
    <a class="nav-tab nav-link d-only" href="events.html"><span>Events</span></a>
    <a class="nav-tab nav-link d-only" href="offerings.html"><span>Offerings</span></a>
    <div class="nav-menu d-only" id="navMenu">
      <button class="nav-tab" aria-haspopup="true" aria-expanded="false" id="navMenuBtn">
        <span>Menu</span>
        <img src="assets/arrow-down.svg" width="20" height="20" alt="">
      </button>
      <div class="dropdown details-panel">
        <div class="panel-links" data-menu="panel" data-order="events,offerings,ashram,involved"></div>
        <form class="subscribe" onsubmit="event.preventDefault(); this.querySelector('input').value=''; this.querySelector('input').placeholder='Thank you for subscribing';">
          <input type="email" required placeholder="Subscribe to e-mail" aria-label="Email address">
          <button type="submit" aria-label="Subscribe">
            <img src="assets/submit-arrow.svg" width="20" height="20" alt="">
          </button>
        </form>
      </div>
    </div>
    <a href="signin.html" class="sign-in d-only">Sign in</a>
    <button class="icon-btn m-only" id="drawerOpen" aria-label="Open menu">
      <img src="assets/m-menu.svg" width="24" height="24" alt="">
    </button>
   </div>
  </div>
</header>

<!-- Mobile drawer -->
<div class="drawer" id="drawer" aria-hidden="true">
  <div class="drawer-head">
    <img class="drawer-logo" src="assets/m-logo.svg" width="254" height="32" alt="Sri Badrika Ashram">
    <button class="drawer-close" id="drawerClose" aria-label="Close menu">&times;</button>
  </div>
  <nav data-menu="drawer" data-mode="accordion" data-order="events,offerings,ashram,involved"></nav>
  <a href="signin.html" class="sign-in drawer-sign-in">Sign in</a>
  <div class="drawer-extra">
    <form class="subscribe" onsubmit="event.preventDefault(); this.querySelector('input').value=''; this.querySelector('input').placeholder='Thank you for subscribing';">
      <input type="email" required placeholder="Subscribe to e-mail" aria-label="Email address">
      <button type="submit" aria-label="Subscribe">
        <img src="assets/submit-arrow.svg" width="20" height="20" alt="">
      </button>
    </form>
  </div>
</div>

<main class="auth">
  <img class="auth-glow saffron" src="assets/glow-saffron-soft.svg" width="460" height="460" alt="" aria-hidden="true">
  <img class="auth-glow sage" src="assets/glow-sage.svg" width="520" height="520" alt="" aria-hidden="true">
  <form class="auth-card" id="authForm" data-mode="signin" novalidate>
    <div class="auth-intro">
      <h1 class="display-2xl">Welcome back</h1>
      <p class="lede">Return to your space for practice, reflection and community.</p>
    </div>
    <div class="auth-fields">
        <div class="field">
          <label for="mobile">Mobile number</label>
          <div class="input phone">
            <select id="country" aria-label="Country code">
              <option value="+91" data-len="10" selected>+91 IN</option>
              <option value="+1" data-len="10">+1 US</option>
              <option value="+44" data-len="10">+44 UK</option>
              <option value="+61" data-len="9">+61 AU</option>
              <option value="+65" data-len="8">+65 SG</option>
              <option value="+971" data-len="9">+971 AE</option>
            </select>
            <span class="divider" aria-hidden="true"></span>
            <input id="mobile" name="mobile" type="tel" inputmode="numeric" autocomplete="tel-national" placeholder="00000-00000" required aria-describedby="mobile-error">
          </div>
          <p class="field-error" id="mobile-error" hidden></p>
        </div>
    </div>
    <div class="auth-actions">
      <button class="btn btn-primary auth-submit" type="submit"><span>Sign in</span><img src="assets/arrow-right-white.svg" width="16" height="16" alt=""></button>
      <p class="auth-status" id="authStatus" role="status" hidden></p>
      <p class="auth-switch">Don’t have an account? <a href="signup.html">Create account</a></p>
    </div>
  </form>
</main>

<div class="cloud-band" aria-hidden="true"></div>

          <a href="privacy-policy.html">Privacy policy</a>
          <a href="terms.html">Terms of use</a>
          <a href="#">Cookie policy</a>

      </details>
      <button class="theme-toggle" id="themeToggle" aria-label="Switch to dark mode">
        <img class="moon" src="assets/moon.svg" width="20" height="20" alt="">
        <img class="sun" src="assets/sun.svg" width="20" height="20" alt="">
      </button>
    </div>
  </div>
</footer>
