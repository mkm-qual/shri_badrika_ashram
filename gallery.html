<!DOCTYPE html>

<script>
  // Follow the computer's light / dark setting (a toggle press overrides it for this visit only),
  // applied before first paint to avoid a flash
  (function () {
    var t = null;
    try { localStorage.removeItem('sba-theme'); t = sessionStorage.getItem('sba-theme'); } catch (e) {}
    if (t !== 'light' && t !== 'dark') {
      t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>
<link rel="preload" href="fonts/Forum-Regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/Outfit-latin.woff2" as="font" type="font/woff2" crossorigin>

  </div>
  <div class="nav-actions">

    </div>
      <button class="pill-menu m-only" id="drawerOpen" aria-label="Open menu"><span class="ic" style="--i:url('icons/menu.svg?v=2');--s:20px" aria-hidden="true"></span></button>
      <a href="signin.html" class="pill-user" aria-label="Sign in" title="Sign in"><span class="ic" style="--i:url('icons/user.svg');--s:18px" aria-hidden="true"></span></a>

   </div>

<!-- Mobile drawer -->
<div class="drawer" id="drawer" aria-hidden="true">

    <form class="subscribe" onsubmit="event.preventDefault(); this.querySelector('input').value=''; this.querySelector('input').placeholder='Thank you for subscribing';">

        <img src="assets/submit-arrow.svg" width="20" height="20" alt="">
      </button>
    </form>
  </div>
</div>


<main class="gl has-crumbs" id="gallery">
  <nav class="crumbs" aria-label="Breadcrumb">
    <a href="./"><span class="ic" style="--i:url('icons/arrow-left.svg')" aria-hidden="true"></span>Home</a>
    <span class="sep" aria-hidden="true">/</span>
    <span aria-current="page">Gallery</span>
  </nav>
  <div class="gl-intro">
    <div class="gl-heading">
      <h1 class="display-2xl">Events, devotion, and community.</h1>
    </div>
    <p class="gl-count"><strong id="albumCount">11</strong><span>Albums</span></p>
  </div>

  <div class="gl-controls">
    <div class="gl-filters" role="group" aria-label="Filter albums">
      <button class="chip" type="button" data-filter="all" aria-pressed="true">All events</button>
      <button class="chip" type="button" data-filter="sadhana" aria-pressed="false">Sadhana</button>
      <button class="chip" type="button" data-filter="discourses" aria-pressed="false">Discourses</button>
      <button class="chip" type="button" data-filter="celebrations" aria-pressed="false">Celebrations</button>
      <button class="chip" type="button" id="albumSort" aria-label="Change sort order"><span class="ic" style="--i:url('icons/chevron-down.svg')" aria-hidden="true"></span><span>Latest first</span></button>
    </div>
    <label class="gl-search">
      <span class="ic" style="--i:url('icons/search.svg');--s:17px" aria-hidden="true"></span>
      <input type="search" id="albumSearch" placeholder="Search events" aria-label="Search events" autocomplete="off">
      <kbd>⌘ K</kbd>
    </label>
  </div>

  <div class="album-grid" id="albumGrid" aria-live="polite"></div>
</main>

<div class="cloud-band" aria-hidden="true"></div>
